<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>POST TRAUMATIC STRESS INDEX (Personal Use)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #e5e7eb;
      --border-soft: #f3f4f6;
      --text-main: #111827;
      --text-muted: #6b7280;
      --primary: #111827;
      --accent: #2563eb;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow: 0 18px 40px rgba(15,23,42,0.12);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #e5e7eb, #f3f4f6 45%, #e5e7eb 100%);
      color: var(--text-main);
      padding: 20px;
    }
    .app {
      max-width: 980px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 22px 20px 26px;
    }
    header {
      margin-bottom: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }
    h1 {
      font-size: 1.6rem;
      margin-top: 6px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 640px;
    }
    .disclaimer {
      margin-top: 10px;
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.85rem;
      color: #92400e;
    }
    .disclaimer strong {
      font-weight: 600;
    }

    .progress {
      margin: 14px 0 18px;
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .progress-bar-outer {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      width: 0;
      background: #111827;
      transition: width 0.2s ease-out;
    }

    .view {
      margin-top: 4px;
    }

    .questions-card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: #f9fafb;
      padding: 10px;
    }

    .questions-list {
      max-height: 58vh;
      overflow-y: auto;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: #ffffff;
    }

    .question-row {
      padding: 10px 12px;
      border-bottom: 1px solid #f3f4f6;
    }
    .question-row:nth-child(even) {
      background: #f9fafb;
    }
    .question-header {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
    }
    .question-index {
      font-size: 0.78rem;
      color: var(--text-muted);
      min-width: 40px;
      text-align: right;
      white-space: nowrap;
    }
    .question-text {
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .question-controls {
      margin-top: 7px;
      display: inline-flex;
      gap: 8px;
    }

    .toggle-group {
      display: inline-flex;
      border-radius: 999px;
      background: #f3f4f6;
      padding: 2px;
      border: 1px solid #e5e7eb;
    }
    .toggle-option {
      position: relative;
    }
    .toggle-option input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
